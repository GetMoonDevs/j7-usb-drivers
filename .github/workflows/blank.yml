name: Mu-Silicium USB survey part 2 (prints the actual USB driver files, no build)

# Save as .github/workflows/usb-survey-2.yml, then Actions -> Run workflow.
# Read-only. Uploads usb-survey-2.txt.

on:
  workflow_dispatch:

jobs:
  survey:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Clone Mu-Silicium
        run: git clone --depth 1 https://github.com/Project-Silicium/Mu-Silicium.git ms

      - name: Dump USB-related files
        working-directory: ms
        run: |
          mkdir -p ../out
          O=../out/usb-survey-2.txt
          show() {  # show FILE [MAXLINES]
            [ -f "$1" ] || return 0
            echo; echo "################ $1  ($(wc -l < "$1") lines)"
            head -n "${2:-250}" "$1"
          }
          {
            echo "=== commit: $(git rev-parse HEAD) ==="

            echo; echo "=== A. Files in the Samsung USB function driver and platform libs ==="
            for d in Silicon/Samsung/SamsungPkg/Drivers/UsbfnDwc3Dxe \
                     Silicon/Samsung/S5E7885Pkg/Library/PlatformUsbfnLib \
                     Silicon/Samsung/S5E9830Pkg/Library/PlatformUsbfnLib \
                     Silicon/Samsung/SamsungNullPkg/Library/PlatformUsbfnLibNull; do
              echo "--- $d"; ls -la "$d" 2>/dev/null
            done

            echo; echo "=== B. Who uses PlatformUsbfnLib / UsbfnDwc3Dxe (dsc/inc/inf/fdf) ==="
            grep -rnE 'PlatformUsbfnLib|UsbfnDwc3Dxe|UsbfnIo|UsbDevice|UsbMass' \
              --include='*.dsc' --include='*.inc' --include='*.inf' --include='*.fdf' . \
              | grep -v '^./Mu_Basecore' | grep -v '^./Common' | head -80

            echo; echo "=== C. Where the boot menu entries 'USB Storage' / 'FFU Mode' come from ==="
            grep -rnE 'USB Storage|FFU Mode|Mass ?Storage' --include='*.c' --include='*.h' --include='*.inf' --include='*.uni' . \
              | grep -v '^./Mu_Basecore' | head -40

            echo; echo "=== D. a10 (Exynos 7884, same family) USB lines in its DXE/APRIORI/DSC ==="
            grep -rniE 'usb|xhci|dwc' Platforms/Samsung/a10Pkg | head -60
            echo; echo "--- S5E7885Pkg dsc/inc lines about USB"
            grep -rniE 'usb|dwc' Silicon/Samsung/S5E7885Pkg --include='*.inc' --include='*.dsc' --include='*.dec' --include='*.inf' | head -60

            echo; echo "=== E. How a Samsung (Snapdragon) phone enables USB HOST in DXE.inc ==="
            grep -niE 'usb|xhci' Platforms/Samsung/r0qPkg/Include/DXE.inc Platforms/Samsung/r0qPkg/Include/APRIORI.inc

            echo; echo "=== F. The Exynos 7870 SoC package ==="
            find Silicon/Samsung/S5E7870Pkg -type f | head -80

            show Silicon/Samsung/S5E7870Pkg/S5E7870Pkg.dsc.inc 200
            show Silicon/Samsung/SamsungPkg/SamsungPkg.dsc.inc 200
            for f in Silicon/Samsung/SamsungPkg/Drivers/UsbfnDwc3Dxe/*.inf \
                     Silicon/Samsung/SamsungPkg/Drivers/UsbfnDwc3Dxe/*.h; do show "$f" 200; done
            for f in Silicon/Samsung/S5E7885Pkg/Library/PlatformUsbfnLib/*; do show "$f" 300; done
          } > "$O" 2>&1
          wc -lc "$O"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: usb-survey-2
          path: out/usb-survey-2.txt
